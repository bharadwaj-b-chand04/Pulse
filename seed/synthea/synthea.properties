# Reference copy of the non-default Synthea settings the pipeline uses.
# seed/scripts/run_synthea.py passes these on the command line (so this
# file is documentation, not read at runtime). Pins live in
# seed/scripts/common.py.
#
# Synthea release : v4.0.0
# jar             : synthea-with-dependencies.jar
# jar sha256      : ed43c20ad40ba5c3bc724503a5af032715fe3c491620b766148e7c2361e6ecc1
# jar size        : 201164144 bytes

exporter.baseDirectory = ./seed/raw/
exporter.csv.export = true
exporter.fhir.export = false
exporter.hospital.fhir.export = false
exporter.practitioner.fhir.export = false
exporter.metadata.export = false
generate.only_alive_patients = true

# CLI: -s 424242 -cs 20260901 -p 120 -r 20260101 Massachusetts
#   -s   patient seed
#   -cs  clinician seed (independent, per ADR-0015)
#   -r   reference date -> deterministic ages
#   Massachusetts is Synthea's demographic base; the overlay replaces
#   every American identity field with an Indian one.
