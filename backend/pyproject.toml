[project]
name = "pulse-backend"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "sqlalchemy==2.0.52",
    "alembic==1.19.1",
    "pydantic==2.13.4",
    "email-validator==2.2.0",
    "pwdlib[argon2]==0.3.1",
    "redis==8.1.0",
    "asyncpg==0.31.0",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "testcontainers[postgres,redis]==4.15.0",
    "ruff==0.16.4",
    "mypy==2.3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are the documented calling convention.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
