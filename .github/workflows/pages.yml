name: Site

# Builds site/ (story + guide rendered from the repo's own docs) and
# publishes it to GitHub Pages. Docs changes redeploy because the guide
# renders them directly.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "*.md", "seed/README.md", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", "docs/**", "*.md", "seed/README.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - name: No placeholder screenshots ship
        run: "! grep -rl 'Screenshot pending' dist"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
